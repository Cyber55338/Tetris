<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfyUI Clone - Node-Based Workflow Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main Application Container -->
    <div id="app">
        <!-- Top Toolbar -->
        <div class="toolbar">
            <div class="toolbar-section">
                <h1 class="app-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <circle cx="6" cy="6" r="2"/>
                        <circle cx="18" cy="6" r="2"/>
                        <circle cx="6" cy="18" r="2"/>
                        <circle cx="18" cy="18" r="2"/>
                        <line x1="8" y1="6" x2="10" y2="10"/>
                        <line x1="16" y1="6" x2="14" y2="10"/>
                        <line x1="8" y1="18" x2="10" y2="14"/>
                        <line x1="16" y1="18" x2="14" y2="14"/>
                    </svg>
                    ComfyUI Clone
                </h1>
            </div>
            <div class="toolbar-section toolbar-actions">
                <button id="btn-new" class="toolbar-btn" title="New Workflow (Ctrl+N)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    New
                </button>
                <button id="btn-save" class="toolbar-btn" title="Save Workflow (Ctrl+S)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save
                </button>
                <button id="btn-load" class="toolbar-btn" title="Load Workflow (Ctrl+O)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    Load
                </button>
                <div class="toolbar-separator"></div>
                <button id="btn-execute" class="toolbar-btn btn-primary" title="Execute Workflow (Ctrl+Enter)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Execute
                </button>
                <button id="btn-clear" class="toolbar-btn" title="Clear Canvas">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Clear
                </button>
            </div>
            <div class="toolbar-section">
                <div class="zoom-controls">
                    <button id="btn-zoom-out" class="toolbar-btn" title="Zoom Out (-)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="8" y1="11" x2="14" y2="11"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </button>
                    <span id="zoom-level" class="zoom-level">100%</span>
                    <button id="btn-zoom-in" class="toolbar-btn" title="Zoom In (+)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="11" y1="8" x2="11" y2="14"/>
                            <line x1="8" y1="11" x2="14" y2="11"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </button>
                    <button id="btn-zoom-reset" class="toolbar-btn" title="Reset Zoom (0)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                    </button>
                    <button id="btn-fit-view" class="toolbar-btn" title="Fit to View (F)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Left Sidebar - Node Library -->
            <div class="sidebar sidebar-left" id="node-library">
                <div class="sidebar-header">
                    <h2>Node Library</h2>
                    <button class="collapse-btn" id="collapse-library">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-content">
                    <input type="text" id="node-search" class="search-input" placeholder="Search nodes...">
                    <div class="node-categories" id="node-categories">
                        <!-- Categories will be populated by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="canvas-container">
                <canvas id="workflow-canvas"></canvas>
                <div class="canvas-info">
                    <span id="canvas-coords">X: 0, Y: 0</span>
                    <span class="separator">|</span>
                    <span id="node-count">Nodes: 0</span>
                </div>
                <!-- Minimap -->
                <div class="minimap-container" id="minimap-container">
                    <div class="minimap-header">
                        <span>Minimap</span>
                        <button class="minimap-toggle" id="minimap-toggle" title="Toggle Minimap">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="18 15 12 9 6 15"/>
                            </svg>
                        </button>
                    </div>
                    <canvas id="minimap-canvas" width="200" height="150"></canvas>
                </div>
                <!-- Context Menu -->
                <div id="context-menu" class="context-menu hidden">
                    <div class="context-menu-item" data-action="add-node">Add Node</div>
                    <div class="context-menu-item" data-action="copy">Copy</div>
                    <div class="context-menu-item" data-action="paste">Paste</div>
                    <div class="context-menu-separator"></div>
                    <div class="context-menu-item" data-action="delete">Delete</div>
                </div>
            </div>

            <!-- Right Sidebar - Properties Panel -->
            <div class="sidebar sidebar-right" id="properties-panel">
                <div class="sidebar-header">
                    <h2>Properties</h2>
                    <button class="collapse-btn" id="collapse-properties">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-content" id="properties-content">
                    <div class="no-selection">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="7" height="7"/>
                            <rect x="14" y="3" width="7" height="7"/>
                            <rect x="14" y="14" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/>
                        </svg>
                        <p>Select a node to view properties</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden file input for loading workflows -->
    <input type="file" id="file-input" accept=".json" style="display: none;">

    <!-- Scripts -->
    <script src="nodes.js"></script>
    <script src="canvas.js"></script>
    <script src="connections.js"></script>
    <script src="workflow.js"></script>
    <script src="comfyui.js"></script>
</body>
</html>
